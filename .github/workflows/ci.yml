name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install "numpy>=1.26,<2.1" "pillow>=10,<12" "ruff>=0.9,<1"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Compile Python sources
        run: python -m compileall -q app.py src tests download_model.py evaluate.py prepare_dataset.py train.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
