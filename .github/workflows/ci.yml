name: Vita AI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vita-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install quality tools
        run: python -m pip install "ruff>=0.9,<1"

      - name: Lint Python
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          app.py src tests download_model.py evaluate.py prepare_dataset.py train.py

  unit-tests:
    name: Safety and unit tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install lightweight test dependencies
        run: python -m pip install "numpy>=1.26,<2.1" "pillow>=10,<12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  app-contract:
    name: Production dependency and app contract
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Verify application import and model contract
        run: |
          python - <<'PY'
          import app
          from src.config import CLASS_NAMES, IMAGE_SIZE

          assert len(CLASS_NAMES) == 38, "The model contract must contain exactly 38 classes"
          assert IMAGE_SIZE == (224, 224), "The model input contract must remain 224 x 224"
          print("Vita AI application import and model contract verified")
          PY

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
